[package]
name = "tauri-no-ios-chrome"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

# A `staticlib`/`cdylib` is required for Tauri's mobile (iOS / Android) targets,
# while `rlib` keeps the desktop binary working.
[lib]
name = "tauri_no_ios_chrome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
